name: docu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Validación rápida: NO llama a ningún modelo, NO escribe nada.
  # Regla del producto: un commit no espera a la documentación.
  check:
    name: frescura de la documentación
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar docu
        run: pip install -e .
      - name: Validar frescura
        run: docu ci check --json
        # Códigos: 0 fresh · 20 hay páginas stale. Si falla, comentar en el PR no es necesario:
        # el propio job indica que hace falta `docu gen --incremental`.

  # Regeneración post-merge: solo las páginas stale, y siempre como PR revisable.
  #
  # El PR se intenta abrir con `gh` y, si el repositorio no permite que Actions cree pull requests
  # (opción de seguridad que viene apagada por defecto), la rama igual queda publicada y el job NO
  # falla: la documentación actualizada no se pierde por un permiso, y el aviso dice qué activar.
  regen:
    name: proponer documentación actualizada
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar docu
        run: pip install -e .
      - name: Regenerar páginas desactualizadas
        run: docu ci regen --out docs/generated
      - name: Publicar rama y proponer PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "docu-bot"
            git config user.email "docu-bot@users.noreply.github.com"
            git checkout -b docs/docu-bot
            git add -A
            git commit -m "docs: regenerar documentación desactualizada"
            git push --force origin docs/docu-bot
            gh pr create --base main --head docs/docu-bot \
              --title "docs: documentación regenerada por docu" \
              --body-file .docu/pr-body.md --label documentation \
              || echo "::warning::la rama está publicada, pero no se pudo abrir el PR: activá 'Allow GitHub Actions to create and approve pull requests' en Settings → Actions → General"
          else
            echo "sin cambios: la documentación ya estaba al día"
          fi
